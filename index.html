<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topazzed - home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>

    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }


    header h1 {
      font-size: 75px;
      font-family: Fredoka;
      color: #ecf32f;
      margin-bottom: 30px;
      font-weight: normal;
      letter-spacing: 1px;
    }


    .card {
      background-color: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 3px;
      width: 260px;
      margin: 0 auto 24px auto;
      padding: 20px;
    }

    .card h2 {
      font-size: 13px;
      color: #888888;
      margin: 0 0 8px 0;
      font-weight: normal;
    }

    .balance {
      font-size: 32px;
      color: #1fe71b;
      margin: 0;
    }

    .nav-buttons button {
      background-color: #282828;
      color: #ffffff;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 8px 16px;
      margin: 0 4px;
      font-size: 14px;
      cursor: pointer;
    }
  

    .nav-buttons button:hover {
      background-color: #383838;
    }
  </style>
</head>
<body>

  <header>
    <h1>Topazzed!</h1>
  </header>

  <main>
    <div class="card">
      <h2>Account Balance</h2>
      <p class="balance">$100</p>
    </div>

    <div class="nav-buttons">
      <button onclick="goToWorkMenu()">Work</button>
      <button>Shop</button>
      <button>Gamble</button>
      <button>Leaderboard</button>
    </div>
  </main>
  <script>
    function goToWorkMenu(){
        window.location.href = "workmenu.html";
    }
  </script>
</body>
</html>
